[project]
name = "flatworld-backend"
version = "0.1.0"
description = "Flatland 2D world simulation backend (FastAPI + WebSocket)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "orjson>=3.10",
    "textual>=8",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
